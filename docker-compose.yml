# Example Docker Compose setup for alexa-fhem.
#
# This base file is the minimum setup. Add the optional compose.*.yml files
# next to it to enable additional features:
#
#   docker compose up -d                                                  # minimum
#   docker compose -f docker-compose.yml -f compose.env.yml up -d         # + custom uid/gid/timezone
#   docker compose -f docker-compose.yml -f compose.skill.yml up -d       # + custom skill on port 3000
#   docker compose -f docker-compose.yml -f compose.logfile.yml up -d     # + additional logfile
#
# For a fhem container see https://github.com/fhem/fhem-docker (it has its own compose examples).
# Files can be combined freely, or selected once via the environment:
#   export COMPOSE_FILE=docker-compose.yml:compose.env.yml:compose.skill.yml

networks:
  net:
    driver: bridge
    # enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.27.0.0/28
          gateway: 172.27.0.1
        # - subnet: fd00:0:0:0:27::/80
        #   gateway: fd00:0:0:0:27::1

services:
  # Minimum example w/o any custom environment variables
  alexa-fhem:
    image: ghcr.io/fhem/alexa-fhem:5.2.1
    restart: always
    networks:
      - net
    volumes:
      - "./alexa-fhem/:/alexa-fhem/"
