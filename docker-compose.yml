# This is an exmaple Docker Compose file to start your own Docker Stack

version: '2.3'

networks:
  net:
    driver: bridge
    # enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 172.27.0.0/28
          gateway: 172.27.0.1
        # - subnet: fd00:0:0:0:27::/80
        #   gateway: fd00:0:0:0:27::1

services:

  ####
  # HINT: use only ONE of the example "alexa-fhem:" service
  # definitions below !
  #

  # Minimum example w/o any custom environment variables
  alexa-fhem:
    image: ghcr.io/fhem/alexa-fhem:5
    restart: always
    networks:
      - net
    volumes:
      - "./alexa-fhem/:/alexa-fhem/"

  # example with dependency towards fhem container to reduce error messages during start
  alexa-fhem:
    depends_on:
      fhem:
        condition: service_healthy
    image: ghcr.io/fhem/alexa-fhem:5
    restart: always
    networks:
      - net
    volumes:
      - "./alexa-fhem/:/alexa-fhem/"

  # Example w/ custom environment variables
  alexa-fhem:
    image: ghcr.io/fhem/alexa-fhem:5
    restart: always
    networks:
      - net
    volumes:
      - "./alexa-fhem/:/alexa-fhem/"
    environment:
      ALEXAFHEM_UID: 6062
      ALEXAFHEM_GID: 6062
      TZ: Europe/Berlin


   # Example w/ alexa custom skill support via port 3000
  alexa-fhem:
    image: ghcr.io/fhem/alexa-fhem:5@sha256:9dacd3e154b1fb3423356f34f03743bf861c88a0447b1c875d6e37cf5357d1bc
    restart: always
    networks:
      - net
    volumes:
      - "./alexa-fhem/:/alexa-fhem/"
    environment:
      ALEXAFHEM_UID: 6062
      ALEXAFHEM_GID: 6062
      TZ: Europe/Berlin


  # Example w/ additional logfile on a volume shared with the fhem container (disabled by default).
  # Needs the top-level "volumes:" section below and the fhem mount shown in the comment.
  alexa-fhem:
    image: ghcr.io/fhem/alexa-fhem:5
    restart: always
    networks:
      - net
    volumes:
      - "./alexa-fhem/:/alexa-fhem/"
      - "alexa_fhem_log:/var/log/alexa-fhem"
    environment:
      ALEXAFHEM_LOGFILE: /var/log/alexa-fhem/alexa-fhem.log

  # fhem container side of the shared volume (mount read-only into a subdirectory, so the FHEM log directory is not hidden):
  #   fhem:
  #     volumes:
  #       - "./fhem/:/opt/fhem/"
  #       - "alexa_fhem_log:/opt/fhem/log/alexa-fhem:ro"
  # FHEM: define alexaFhemLog FileLog /opt/fhem/log/alexa-fhem/alexa-fhem.log fakelog

# Required by the logfile example above
volumes:
  alexa_fhem_log:
